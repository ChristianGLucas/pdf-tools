// Data contracts for christiangeorgelucas/pdf-tools — stateless PDF text &
// layout extraction wrapping the MIT-licensed pdfminer.six library.
//
// All nodes consume the single `Pdf` input envelope (raw bytes + options) and
// emit a purpose-shaped result. Coordinates in layout results use PDF user-space
// units (points, 1/72 inch) with the origin at the BOTTOM-LEFT of the page, which
// is pdfminer.six's native coordinate system.

syntax = "proto3";

package christiangeorgelucas.pdf_tools;

// A PDF document to analyze, plus per-call limits. The single input envelope
// shared by every node in this package.
message Pdf {
  // Raw PDF file bytes (base64-encoded over JSON). Must begin with a `%PDF-`
  // header within the first 1KB. Hard size cap of 30 MB applies before parsing.
  bytes data = 1;
  // Optional password for an encrypted PDF. Leave empty for unencrypted files
  // or files encrypted with an empty owner/user password.
  string password = 2;
  // Optional cap on the number of pages processed (1-2000). 0 selects the
  // default cap of 500. Documents with more pages are truncated, not rejected.
  int32 max_pages = 3;
}

// Full-document extracted text.
message TextResult {
  // Normalized plain text of the document, pages joined by a blank line, in
  // pdfminer.six's layout-analyzed reading order.
  string text = 1;
  // Number of pages actually processed.
  int32 page_count = 2;
  // True when the document had more pages than were processed (page cap hit).
  bool truncated = 3;
  // Structured error message; empty on success. Set instead of raising on
  // malformed input, wrong password, or oversized input.
  string error = 4;
}

// One page's extracted text.
message Page {
  // 1-based page number.
  int32 number = 1;
  // Normalized plain text of this page.
  string text = 2;
}

// Per-page text segmentation.
message PagesResult {
  // Pages in document order.
  repeated Page pages = 1;
  // Number of pages actually processed (== pages length).
  int32 page_count = 2;
  // True when the document had more pages than were processed (page cap hit).
  bool truncated = 3;
  // Structured error message; empty on success.
  string error = 4;
}

// A single line of text with its bounding box, in PDF points, origin bottom-left.
message TextLine {
  // Text of the line (includes a trailing newline as emitted by pdfminer.six).
  string text = 1;
  // Left edge (x0), in PDF points.
  double x0 = 2;
  // Bottom edge (y0), in PDF points (origin bottom-left).
  double y0 = 3;
  // Right edge (x1), in PDF points.
  double x1 = 4;
  // Top edge (y1), in PDF points.
  double y1 = 5;
}

// A layout-analyzed text block (paragraph/column region) with its bounding box.
message TextBlock {
  // Concatenated text of all lines in the block.
  string text = 1;
  // Left edge (x0), in PDF points.
  double x0 = 2;
  // Bottom edge (y0), in PDF points (origin bottom-left).
  double y0 = 3;
  // Right edge (x1), in PDF points.
  double x1 = 4;
  // Top edge (y1), in PDF points.
  double y1 = 5;
  // Constituent lines with their own bounding boxes.
  repeated TextLine lines = 6;
}

// One page's layout: dimensions plus the text blocks pdfminer.six's layout
// analysis grouped from character positions.
message PageLayout {
  // 1-based page number.
  int32 number = 1;
  // Page width in PDF points.
  double width = 2;
  // Page height in PDF points.
  double height = 3;
  // Text blocks in the order pdfminer.six emitted them.
  repeated TextBlock blocks = 4;
}

// Per-page layout with positional metadata for section/table detection.
message LayoutResult {
  // Pages in document order, each with its text blocks and bounding boxes.
  repeated PageLayout pages = 1;
  // Number of pages actually processed.
  int32 page_count = 2;
  // True when the document had more pages than were processed (page cap hit).
  bool truncated = 3;
  // Structured error message; empty on success.
  string error = 4;
}

// One entry in a document's outline (bookmark / table-of-contents) tree.
message OutlineEntry {
  // Nesting depth; 0 for a top-level entry, 1 for its children, etc.
  int32 level = 1;
  // Bookmark title text.
  string title = 2;
  // 1-based target page number when the entry resolves to an internal page
  // destination; 0 if it targets something else (an external/URI link, a
  // remote-file destination, or a destination pdfminer.six could not resolve).
  int32 page = 3;
  // Target URI when the entry is an external web link (a /URI action);
  // empty otherwise.
  string uri = 4;
}

// A document's outline / bookmark tree, flattened to entry order (a
// depth-first walk; `level` reconstructs the hierarchy).
message OutlineResult {
  repeated OutlineEntry entries = 1;
  // True when the outline had more entries than were processed (entry cap hit).
  bool truncated = 2;
  // Structured error message; empty on success. A well-formed PDF with no
  // outline/bookmarks at all is NOT an error — it returns zero entries.
  string error = 3;
}

// A single page annotation: a comment, highlight, hyperlink, form-field
// widget marker, or similar markup object.
message Annotation {
  // 1-based page number the annotation appears on.
  int32 page = 1;
  // Annotation subtype exactly as declared in the PDF (e.g. "Link", "Text",
  // "Highlight", "FreeText", "Popup", "Widget", "Square").
  string subtype = 2;
  // Bounding box in PDF points, origin bottom-left.
  double x0 = 3;
  double y0 = 4;
  double x1 = 5;
  double y1 = 6;
  // Comment/note text (the /Contents entry), decoded; empty if absent.
  string contents = 7;
  // Author of the annotation (the /T entry on markup annotations); empty if absent.
  string author = 8;
  // Target URI when this annotation is a hyperlink with a /URI action;
  // empty otherwise.
  string uri = 9;
  // 1-based internal target page when this annotation is an internal jump
  // link (a GoTo action or a /Dest entry); 0 if not an internal link or
  // unresolvable.
  int32 dest_page = 10;
}

// Every annotation (including hyperlinks) found on the processed pages.
message AnnotationsResult {
  repeated Annotation annotations = 1;
  // True when more annotations existed than were processed (annotation cap
  // hit, or the page cap truncated the pages scanned).
  bool truncated = 2;
  string error = 3;
}

// One AcroForm interactive field and its current value.
message FormField {
  // Fully-qualified field name (dot-joined parent.child, as PDF viewers show it).
  string name = 1;
  // Field type: "Tx" (text), "Btn" (button/checkbox/radio), "Ch" (choice/list
  // or combo box), "Sig" (signature), or empty if undeclared.
  string field_type = 2;
  // Current value, decoded to a string ("" if unset). For a checkbox/radio
  // this is the selected export name (e.g. "Yes", "Off").
  string value = 3;
  // 1-based page the field's widget appears on; 0 if it could not be
  // resolved to a single page.
  int32 page = 4;
}

// The AcroForm's interactive field values.
message FormFieldsResult {
  repeated FormField fields = 1;
  // True when the form had more fields than were processed (field cap hit).
  bool truncated = 2;
  // True if the document declares an /AcroForm dictionary at all. A form
  // with zero fields still has has_form = true and an empty `fields` list;
  // a document with no form at all has has_form = false.
  bool has_form = 3;
  string error = 4;
}

// One embedded raster image and its pixel/compressed data.
message EmbeddedImage {
  // 1-based page number the image appears on.
  int32 page = 1;
  // Internal resource name (e.g. "Im0"), for reference/dedup only.
  string name = 2;
  // Placement bounding box on the page, in PDF points, origin bottom-left.
  double x0 = 3;
  double y0 = 4;
  double x1 = 5;
  double y1 = 6;
  // Source pixel dimensions as declared by the image XObject.
  int32 width = 7;
  int32 height = 8;
  // Bits per color component.
  int32 bits_per_component = 9;
  // Colorspace name(s) as declared (e.g. "DeviceRGB", "DeviceGray", "Indexed").
  repeated string colorspace = 10;
  // Format of `data`: "jpeg" (DCTDecode, pass-through JPEG file bytes), "jp2"
  // (JPXDecode, pass-through JPEG2000 bytes), "raw" (fully decompressed
  // interleaved sample data, row-major, no container), or "unsupported" (a
  // filter pdfminer.six cannot decode, e.g. CCITT fax/JBIG2 — data is empty).
  string format = 11;
  // Image bytes per `format` above (base64-encoded over JSON). Empty when
  // format == "unsupported" or when decoding exceeded the per-image byte
  // cap (see truncated_data) — metadata fields above are still populated.
  bytes data = 12;
  // True if this image's data was omitted for exceeding the per-image byte cap.
  bool truncated_data = 13;
}

// Every embedded image found on the processed pages.
message ImagesResult {
  repeated EmbeddedImage images = 1;
  // True when more images existed than were processed (image cap hit, or
  // the page cap truncated the pages scanned).
  bool truncated = 2;
  string error = 3;
}

// Usage of one (font, size) pair on a page.
message FontUsage {
  // Font's base name as declared (e.g. "Helvetica", "ABCDEF+Calibri-Bold";
  // a "SUBSET+" prefix indicates a font subset embedded in the document).
  string name = 1;
  // Font size in points as rendered.
  double size = 2;
  // Number of characters rendered with this font+size on the page.
  int32 char_count = 3;
}

// One page's distinct (font, size) usage, ordered by descending char_count.
message PageFonts {
  int32 number = 1;
  repeated FontUsage fonts = 2;
}

// Per-page font/character-property inventory — which fonts and sizes are
// used where, and how much. Useful for heading/style detection, font
// audits, and redaction/compliance checks.
message FontsResult {
  repeated PageFonts pages = 1;
  int32 page_count = 2;
  bool truncated = 3;
  string error = 4;
}

// Document-level metadata and structural facts.
message InfoResult {
  // Total number of pages (bounded at 2000).
  int32 page_count = 1;
  // True if the PDF declares an encryption dictionary.
  bool encrypted = 2;
  // Document title from the info dictionary (empty if absent).
  string title = 3;
  // Document author (empty if absent).
  string author = 4;
  // Document subject (empty if absent).
  string subject = 5;
  // Creating application / creator (empty if absent).
  string creator = 6;
  // Producer (empty if absent).
  string producer = 7;
  // Keywords (empty if absent).
  string keywords = 8;
  // Raw creation-date string from the info dictionary (empty if absent).
  string created = 9;
  // Raw modification-date string from the info dictionary (empty if absent).
  string modified = 10;
  // True when page counting stopped at the 2000-page cap.
  bool truncated = 11;
  // Structured error message; empty on success.
  string error = 12;
}
